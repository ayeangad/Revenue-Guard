name: ci
'on':
  push: null
  pull_request: null
  schedule:
    - cron: '0 3 * * *'
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/quality_gates.py
  full-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-eval')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run python evals/runner/run.py --tiers 1,2,3 --variants 10 --seeds 3 --include-private
      - run: uv run python evals/judges/judges.py
      - run: uv run python scripts/scorecard.py
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: bash scripts/clean_repro.sh /tmp/rg-nightly
