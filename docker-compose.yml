services:
  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://rg:rg@postgres:5432/rg
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    env_file: [.env]
    depends_on: [postgres]
  sim-store:
    build: .
    command: uvicorn commerce.sim.store:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
  worker:
    build: .
    command: python -m apps.worker.main
    env_file: [.env]
    depends_on: [postgres, api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rg
      POSTGRES_PASSWORD: rg
      POSTGRES_DB: rg
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # Redis is OPTIONAL (ephemeral locks only). Uncomment when needed.
  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]

volumes:
  pgdata:
